<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>示例学习报告</title>
		<style>
			body {
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
					'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
				max-width: 760px;
				margin: 3rem auto;
				padding: 0 1.2rem;
				line-height: 1.7;
				color: #2a3b45;
				background: #f5fafc;
			}
			h1 {
				color: #2f6b8f;
			}
			.tip {
				background: #dcecf5;
				border-radius: 12px;
				padding: 1rem 1.2rem;
			}
		</style>
	</head>
	<body>
		<h1>示例学习报告</h1>
		<p>这是一个示例。你以后做的学习报告网页，直接拷到 <code>public/reports/</code> 目录里就行。</p>
		<div class="tip">
			<strong>怎么加新报告：</strong> 把生成好的 <code>.html</code> 文件放进
			<code>public/reports/</code>，推送后它会自动出现在「学习报告」列表里。列表标题取自 html 的
			<code>&lt;title&gt;</code>。
		</div>
	</body>
</html>
